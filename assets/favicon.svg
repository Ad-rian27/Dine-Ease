<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Restaurant Cloche / Dining Icon -->
  <g transform="translate(0, 1)">
    <!-- Cloche Knob -->
    <circle cx="32" cy="18" r="3.5" fill="url(#iconGrad)"/>

    <!-- Cloche Dome -->
    <path d="M 16 38 A 16 16 0 0 1 48 38 Z" fill="url(#iconGrad)"/>

    <!-- Cloche Base Plate -->
    <path d="M 12 42 H 52 C 53.1 42 54 42.9 54 44 C 54 45.1 53.1 46 52 46 H 12 C 10.9 46 10 45.1 10 44 C 10 42.9 10.9 42 12 42 Z" fill="#ffffff"/>

    <!-- Steam Accents -->
    <path d="M 26 13 C 26 13 27 10 26 8" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 32 12 C 32 12 33 9 32 7" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.95"/>
    <path d="M 38 13 C 38 13 39 10 38 8" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>
</svg>
